name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}
      - run: uv sync --locked
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - run: uv run pytest

  mcp-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          python-version: "3.12"
      - run: uv sync --locked --extra mcp
      - name: Construct MCP server and list tools
        run: >-
          uv run --extra mcp python -c "import asyncio;
          from infertop.mcp_server import create_server;
          server=create_server();
          names={tool.name for tool in asyncio.run(server.list_tools())};
          assert names == {'diagnose_endpoint', 'probe_inference_endpoint'}"
