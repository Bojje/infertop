[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "infertop"
version = "0.2.0"
description = "Read-only diagnostics for LLM inference servers"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "infertop contributors" }]
keywords = ["vllm", "inference", "prometheus", "llm", "observability"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: System :: Monitoring",
]
dependencies = ["httpx>=0.27,<1"]

[project.urls]
Homepage = "https://github.com/Bojje/infertop"
Repository = "https://github.com/Bojje/infertop"
Issues = "https://github.com/Bojje/infertop/issues"

[project.scripts]
infertop = "infertop.cli:main"
infertop-mcp = "infertop.mcp_server:main"

[project.optional-dependencies]
tui = ["textual>=8.2,<9"]
nvml = ["nvidia-ml-py>=12"]
mcp = ["mcp>=1.27,<2"]

[dependency-groups]
dev = [
  "pytest>=8.3",
  "ruff>=0.9",
]

[tool.hatch.build.targets.wheel]
packages = ["src/infertop"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
